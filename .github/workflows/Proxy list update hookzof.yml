name: Proxy hookzof Update

on:
  schedule:
    - cron: '10 */2 * * *'  # Runs every 2 hours
  workflow_dispatch:

jobs:
  fetch-hookzof-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: create lookup
        run: |
          cd Lists/PROXY/hookzof_socks5
          python3 create_lookup_file.py
          
      - name: List files in the target directory
        run: ls -la Lists/PROXY/hookzof_socks5

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add Lists/PROXY/hookzof_socks5/*
          git commit -m "Update hookzof proxy files" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
