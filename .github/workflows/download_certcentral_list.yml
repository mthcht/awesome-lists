name: CertCentral Suspicious Signers List Update

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  fetch-CertCentral-Signer-List:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run CertCentral signer list downloader
        run: |
          cd Lists/CERTS
          python download_certcentral_suspicious_signers_list.py

      - name: Show resulting files
        run: ls -l Lists/CERTS

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add Lists/CERTS/certcentral_signers_list.csv
          git commit -m "Update CertCentral Suspicious Signers List" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
