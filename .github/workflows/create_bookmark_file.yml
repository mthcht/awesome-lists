name: Create Bookmarks on README Change

on:
  push:
    paths:
      - "README.md"
    branches:
      - main

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x' 

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || echo "No requirements.txt found, skipping installation"

      - name: Run script
        run: |
          cd _utils/
          python create_bookmarks_file_to_import.py

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stash changes before pulling to avoid conflicts
          git stash --include-untracked
          git pull --rebase
          git stash pop || echo "No stashed changes to apply"

          git add "_utils"
          git commit -m "Update Defender signatures list" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
