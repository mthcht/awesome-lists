name: Surfshark VPN Update

on:
  schedule:
    - cron: '0 */2 * * *'  # Runs every 2 hours
  workflow_dispatch:

jobs:
  fetch-surfshark-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Surfshark Config Script
        run: |
          cd Lists/VPN/SurfSharkVPN
          python fetch_surfshark_servers_ip_address.py

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add Lists/VPN/SurfSharkVPN/surfshark_vpn_servers_domains_and_ips_list.csv
          git commit -m "Update Surfshark domains and IPs" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
