name: Fetch Imperva IP Ranges

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lists/Ranges_IP_Address_Company_List/imperva

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Imperva IP range fetch script
        run: python fetch_imperva_ip_ranges.py

      - name: Commit and push updates
        run: |
          git pull --rebase
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add imperva_ip_ranges.csv
          git commit -m "Update Imperva IP ranges [auto]" || echo "No changes to commit"
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
