name: hourly VSXSentry Feed Update

on:
  schedule:
    - cron: '17 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run VSXSentry feed builder
        run: |
          cd "Lists/VSCODE Extensions"
          python build_vscode_extensions_feed.py

      - name: List files
        run: ls -la

      - name: List files in the VSCode Extensions directory
        run: ls -la "Lists/VSCODE Extensions"

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add "Lists/VSCODE Extensions/feeds"
          git commit -m "Update VSXSentry feed" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
