name: ThreatFox IP-Port Update

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:

jobs:
  update-threatfox-ip-port:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ThreatFox IP-Port script
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
        run: |
          cd Lists/IP/Threatfox/
          python fetch_threatfox_ip_port.py

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Action"
          git pull
          git add Lists/IP/Threatfox/threatfox_ip_ports_list.csv
          git commit -m "Update ThreatFox IP-Port feed" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
