name: Daily update RMM lists

on:
  schedule:
    - cron: '10 0 * * *'  # Runs every day
  workflow_dispatch:

jobs:
  fetch-RMM-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run scripts from the RMM folder
        run: |
          cd Lists/RMM
          python update_RMM_detection.py
    
      - name: List files
        run: ls -la

      - name: List files in the Lists/RMM directory
        run: ls -la Lists/RMM
        
      - name: Commit any changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Lists/RMM/*
          git commit -m "Save changes before rebase" --allow-empty

      - name: Rebase on latest changes
        run: |
          git pull
          git fetch origin
          git rebase origin/main

      - name: Push updated results
        run: |
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
