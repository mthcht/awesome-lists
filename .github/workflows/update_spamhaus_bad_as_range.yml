name: Resolve Spamhaus ASN Ranges

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-spamhaus-asn-ranges:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run resolver script
        run: |
          cd Lists/ASNs
          python resolve_spamhaus_ranges.py

      - name: List files
        run: ls -la Lists/ASNs

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Lists/ASNs/spamhaus_asn_list_resolved.csv
          git add Lists/ASNs/spamhaus_asn_list_resolved_only_ip_ranges.csv
          git commit -m "Update Spamhaus ASN resolved ranges" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
