name: Proxy proxmint free-proxy-list Update

on:
  schedule:
    - cron: '35 * * * *'  # Runs every hour (the list is republished at 25 and 55 past the hour)
  workflow_dispatch:

jobs:
  fetch-proxmint-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all.txt File from proxmint/free-proxy-list
        run: |
          # Define the target directory
          TARGET_DIR=Lists/PROXY/proxmint_free-proxy-list
          mkdir -p $TARGET_DIR

          # Every entry relayed a real HTTP request in the last few hours; dead entries are dropped every 30 minutes
          URL="https://raw.githubusercontent.com/proxmint/free-proxy-list/refs/heads/main/proxies/all.txt"
          echo "Downloading all.txt from $URL"
          curl -fL -o "$TARGET_DIR/all.txt" "$URL" || echo "Failed to download all.txt"

      - name: create lookup
        run: |
          cd Lists/PROXY/proxmint_free-proxy-list
          python3 create_lookup_file.py

      - name: List files in the target directory
        run: ls -la Lists/PROXY/proxmint_free-proxy-list

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add Lists/PROXY/proxmint_free-proxy-list/*
          git commit -m "Update hourly proxmint free-proxy-list files" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
