name: Proxy fresh-proxy-list Update

on:
  schedule:
    - cron: '10 */2 * * *'  # Runs every 2 hour
  workflow_dispatch:

jobs:
  fetch-fresh-proxy-list-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        
      - name: create lookup
        run: |
          cd Lists/PROXY/fresh-proxy-list
          python3 create_lookup_file.py
          
      - name: List files in the target directory
        run: ls -la Lists/PROXY/fresh-proxy-list

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add Lists/PROXY/fresh-proxy-list/*
          git commit -m "Update hourly fresh-proxy-list files" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
