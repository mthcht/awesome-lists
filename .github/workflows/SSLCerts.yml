name: SSL certs Data Processing

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day
  workflow_dispatch:

jobs:
  process-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run the script
        run: python "Lists/SSL CERTS/get_ssl_cert_list.py"

      - name: List files in the root directory
        run: ls -la

      - name: List files in the Lists/SSL CERTS directory
        run: ls -la "Lists/SSL CERTS/"

      - name: Move output files to correct directory (if necessary)
        run: |
          mv ssl_certificates_malicious_list.csv "Lists/SSL CERTS/" || echo "File not found in root."

      - name: Commit and Push Changes
        run: |
          git pull
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "Lists/SSL CERTS/ssl_certificates_malicious_list.csv"
          git commit -m "Update ssl_certificates_malicious list" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done


