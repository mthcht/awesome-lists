name: Daily IP Range Updates

on:
  schedule:
    - cron: '0 7 * * *'  # Runs at 07:00 AM every day
  workflow_dispatch:

jobs:
  fetch-ip-ranges:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Run the script
        run: python Lists/Ranges_IP_Address_Company_List/bgp.he.net/get_ip_range.py -list microsoft,webex,DigitalOcean,Zscaler,Akamai,Proofpoint,Teamviewer,AS211805,AS206728,AS216309,AS56971,AS206728,AS36352,Netskope -format csv

      - name: List files in the root directory
        run: ls -la

      - name: List files in the Lists/TOR directory
        run: ls -la Lists/Ranges_IP_Address_Company_List/bgp.he.net/

      - name: Move output files to correct directory (if necessary)
        run: |
          mv *_IP_Ranges.csv Lists/Ranges_IP_Address_Company_List/bgp.he.net/ || echo "File not found in root."

      - name: Commit and Push results
        run: |
          git pull
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Lists/Ranges_IP_Address_Company_List/bgp.he.net/*_IP_Ranges.csv
          git commit -m "Update daily IP ranges" --allow-empty
          git pull
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
