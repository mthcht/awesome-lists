name: weekly Bad TLDs and valid tlds Update

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs every week
  workflow_dispatch:

jobs:
  fetch-tlds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scripts from the TLDs folder
        run: |
          cd Lists/TLDs
          python fetch_cybercrimeinfocenter_phishing_tlds_stats.py
          python fetch_valid_tlds.py
          
      - name: List files
        run: ls -la

      - name: List files in the Lists/TLDs directory
        run: ls -la Lists/TLDs

      - name: Commit and Push results
        run: |
          git pull
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add Lists/TLDs/*
          git commit -m "Update weekly bad TLDs" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
