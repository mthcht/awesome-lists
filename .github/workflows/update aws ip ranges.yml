name: AWS IP Ranges Sync update

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:

jobs:
  update-aws-ip-ranges:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        run: |
          cd "Lists/Ranges_IP_Address_Company_List/Cloud Hosting Providers/AWS"
          python3 update_aws_ip_range.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add "Lists/Ranges_IP_Address_Company_List/Cloud Hosting Providers/AWS/*"
          git commit -m "Update AWS IP Ranges (every 2 hours)" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
