name: daily DYNDNS list update

on:
  schedule:
    - cron: '0 8 * * *'  # Runs every day
  workflow_dispatch:

jobs:
  fetch-dyndns:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scripts from the DYNDNS/dyn-dns-list-alexandrosmagos folder
        run: |
          cd Lists/DYNDNS/dyn-dns-list-alexandrosmagos
          python fetch_dyndns_lists_from_github_alexandrosmagos.py
    
      - name: List files
        run: ls -la

      - name: List files in the Lists/DYNDNS/dyn-dns-list-alexandrosmagos
        run: ls -la Lists/DYNDNS/dyn-dns-list-alexandrosmagos

      - name: Commit and Push results
        run: |
          git pull
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add Lists/DYNDNS/dyn-dns-list-alexandrosmagos/*
          git commit -m "Update daily DYNDNS" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
