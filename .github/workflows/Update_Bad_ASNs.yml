name: weekly Bad ASN Update

on:
  schedule:
    - cron: '0 0 */1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bad-asn-update
  cancel-in-progress: false

jobs:
  fetch-ip-ranges:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Run scripts from the ASNs folder
        run: |
          cd Lists/ASNs
          python fetch_cybercrimeinfocenter_phishing_asn_stats.py
          python fetch_IP_ranges_of_bad_ASN.py
          python create_combined_ALL_BAD_ASN_List.py

      - name: Show resulting files
        run: |
          ls -lh Lists/ASNs/
          ls -lh Lists/ASNs/ASN_IP_Ranges/ | head -30

      - name: Commit and Push results
        run: |
          git config user.name "mthcht"
          git config user.email "75267080+mthcht@users.noreply.github.com"

          # Remove previously tracked logs from the Git index.
          # Files on disk are preserved.
          git rm -f --cached --ignore-unmatch -- \
            Lists/ASNs/get_ip_range_debug.log \
            Lists/ASNs/get_ip_range_debug.log.1 \
            Lists/ASNs/ASN_FETCH_DONE.log

          # Stage generated data, excluding diagnostic logs.
          git add -A -- Lists/ASNs \
            ':!Lists/ASNs/get_ip_range_debug.log*' \
            ':!Lists/ASNs/ASN_FETCH_DONE.log'

          if git diff --cached --quiet; then
            echo "No ASN data changes"
            exit 0
          fi

          git commit -m "Update bad ASN lists"

          # Retry pushes if concurrent workflows update main.
          for i in {1..8}; do
            git fetch origin main

            git rebase origin/main || {
              git rebase --abort
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Successfully pushed ASN updates"
              exit 0
            fi

            sleep $((i * 3 + RANDOM % 5))
          done

          echo "Failed to push ASN updates"
          exit 1
