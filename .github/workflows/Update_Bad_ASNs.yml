name: weekly Bad ASN Update

on:
  schedule:
    - cron: '0 0 */1 * *'
  workflow_dispatch:

jobs:
  fetch-ip-ranges:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Run scripts from the ASNs folder
        run: |
          cd Lists/ASNs
          python fetch_cybercrimeinfocenter_phishing_asn_stats.py
          python fetch_IP_ranges_of_bad_ASN.py
          python create_combined_ALL_BAD_ASN_List.py
    
      - name: List files
        run: ls -la

      - name: List files in the Lists/ASNs directory
        run: ls -la Lists/ASNs

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git add Lists/ASNs/*
          git commit -m "Update weekly bad ASN" --allow-empty
          # Many workflows push to main on overlapping schedules; retry if rejected
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            if [ "$i" -eq 5 ]; then echo "Push failed after 5 attempts"; exit 1; fi
            echo "Push rejected (attempt $i), rebasing and retrying..."
            sleep $((RANDOM % 20 + 10))
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; true; }
          done
